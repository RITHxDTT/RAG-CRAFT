server:
  port: ${PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${DB_USER:ragcraft}
    password: ${DB_PASSWORD:ragcraft}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

ragcraft:
  internal-token: ${INTERNAL_TOKEN:change-me-internal-token}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-me-please-32chars}
    session-minutes: ${SESSION_MINUTES:480}
    cookie-secure: ${COOKIE_SECURE:false}
  services:
    chatbot: ${CHATBOT_SERVICE_URL:http://localhost:8083}
    knowledge: ${KNOWLEDGE_SERVICE_URL:http://localhost:8084}

identity:
  # Demo accounts admin@gmail.com / user@gmail.com with password 123, as in the frontend demo.
  seed-demo-accounts: ${SEED_DEMO_ACCOUNTS:false}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  # log = print reset tokens to the log and return them in the API (development only). smtp is not wired yet.
  mail-mode: ${MAIL_MODE:log}
  # false = new accounts start UNVERIFIED and must confirm an e-mailed link before signing in.
  auto-verify-email: ${AUTO_VERIFY_EMAIL:true}
  max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
identity:
  seed-demo-accounts: true
